```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tasmania Time Overlay</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        .overlay {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 18px 24px;

            background: rgba(0, 0, 0, 0.60);
            border-radius: 10px;

            color: white;

            /* Keeps the box reasonably square without being excessive */
            min-width: 210px;
            min-height: 110px;

            text-align: center;
        }

        .time {
            font-size: 38px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 1px;
            margin-bottom: 10px;
            white-space: nowrap;
        }

        .date {
            font-size: 18px;
            font-weight: 400;
            line-height: 1.2;
            white-space: nowrap;
        }
    </style>
</head>

<body>

    <div class="overlay">
        <div class="time" id="time">--:--:--</div>
        <div class="date" id="date">Loading...</div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();

            // Tasmania timezone
            const timeOptions = {
                timeZone: "Australia/Hobart",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            };

            const dateOptions = {
                timeZone: "Australia/Hobart",
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            };

            document.getElementById("time").textContent =
                new Intl.DateTimeFormat("en-AU", timeOptions).format(now);

            document.getElementById("date").textContent =
                new Intl.DateTimeFormat("en-AU", dateOptions).format(now);
        }

        // Update immediately
        updateTime();

        // Update every second
        setInterval(updateTime, 1000);
    </script>

</body>
</html>
```
