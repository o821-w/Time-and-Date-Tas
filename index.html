<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tasmania Time Overlay</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: "Inter", sans-serif;
        }

        .overlay {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 18px 24px;
            min-width: 180px;
            min-height: 95px;

            background: rgba(0, 0, 0, 0.60);
            border-radius: 0 0 10px 0;

            color: white;
            text-align: center;
        }

        .time {
            font-size: 38px;
            font-weight: 600;
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .date {
            font-size: 32px;
            font-weight: 400;
            line-height: 1;
            white-space: nowrap;
        }
    </style>
</head>

<body>

    <div class="overlay">
        <div class="time" id="time">--:-- --</div>
        <div class="date" id="date">--/--/----</div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();

            const timeOptions = {
                timeZone: "Australia/Hobart",
                hour: "numeric",
                minute: "2-digit",
                hour12: true
            };

            const dateOptions = {
                timeZone: "Australia/Hobart",
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            };

            let time = new Intl.DateTimeFormat("en-AU", timeOptions).format(now);

            // Make AM/PM lowercase
            time = time.replace("AM", "am").replace("PM", "pm");

            document.getElementById("time").textContent = time;

            document.getElementById("date").textContent =
                new Intl.DateTimeFormat("en-AU", dateOptions).format(now);
        }

        updateTime();

        setInterval(updateTime, 1000);
    </script>

</body>
</html>
